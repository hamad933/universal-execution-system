name: UES RP Authority-Gated Lifecycle

on:
  workflow_dispatch:
    inputs:
      project:
        description: RP project to reconcile
        required: true
        type: choice
        default: ALL
        options:
          - ALL
          - RP01
          - RP02
          - RP03
          - RP04
      current_authority_json:
        description: Bounded controller-attested Drive Current Authority envelope
        required: true
        type: string
      wakeup_type:
        description: Allowlisted lifecycle wakeup type
        required: false
        type: string
        default: EXTERNAL_RECONCILIATION_REQUEST
      wakeup_event_id:
        description: Stable upstream event id for coalescing
        required: false
        type: string
  repository_dispatch:
    types: [ues-rp-lifecycle-wakeup]

permissions:
  contents: write

jobs:
  rp-current-authority-cycle:
    if: >-
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["ALL","RP01","RP02","RP03","RP04"]'), inputs.project)) ||
      (github.event_name == 'repository_dispatch' && contains(fromJSON('["RP01","RP02","RP03","RP04"]'), github.event.client_payload.project))
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        project: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.project == 'ALL' && '["RP01","RP02","RP03","RP04"]' || format('["{0}"]', github.event_name == 'repository_dispatch' && github.event.client_payload.project || inputs.project)) }}
    concurrency:
      group: ues-project-lifecycle-${{ matrix.project }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout governed UES runtime
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UES
        run: python -m pip install -e .

      - name: Require explicit bounded Current Authority transport
        env:
          UES_CURRENT_AUTHORITY_JSON: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload.current_authority) || inputs.current_authority_json || '' }}
        run: |
          if [ -z "$UES_CURRENT_AUTHORITY_JSON" ]; then
            echo "Current Authority transport is required for RP effect ingress."
            exit 2
          fi

      - name: Enforce durable evidence transport byte attestation before RP lifecycle effects
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UES_ALLOW_PUBLIC_SAME_REPO_STATE: "true"
          UES_STATE_REF_PREFIX: ues-runtime/v2
          UES_CURRENT_AUTHORITY_JSON: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload.current_authority) || inputs.current_authority_json || '' }}
        run: python -m ues.evidence_transport_attestation_gate

      - name: Run RP shared current-authority lifecycle
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          UES_ALLOW_PUBLIC_SAME_REPO_STATE: "true"
          UES_STATE_REF_PREFIX: ues-runtime/v2
          UES_AUTHORITY_TRANSPORT_ACTOR: ${{ github.actor }}
          UES_CURRENT_AUTHORITY_JSON: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload.current_authority) || inputs.current_authority_json || '' }}
          UES_WAKEUP_EVENT_ID: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.event_id || inputs.wakeup_event_id || '' }}
          UES_WAKEUP_EVENT_TYPE: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.event_type || (github.event_name == 'workflow_dispatch' && inputs.wakeup_type) || '' }}
          UES_WAKEUP_EVENT_SOURCE: ${{ github.event_name }}
          UES_WAKEUP_REPOSITORY: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.repository || '' }}
          UES_WAKEUP_WORKSTREAM: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.workstream || '' }}
          UES_WAKEUP_SHA: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.sha || '' }}
        run: python -m ues.rp_authority_runtime ${{ matrix.project }}

      - name: Run guarded initial logical lineage creation/reconciliation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          UES_ALLOW_PUBLIC_SAME_REPO_STATE: "true"
          UES_STATE_REF_PREFIX: ues-runtime/v2
          UES_AUTHORITY_TRANSPORT_ACTOR: ${{ github.actor }}
          UES_CURRENT_AUTHORITY_JSON: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload.current_authority) || inputs.current_authority_json || '' }}
        run: python -m ues.initial_lineage_runtime ${{ matrix.project }}
