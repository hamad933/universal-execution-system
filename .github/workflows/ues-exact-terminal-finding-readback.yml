name: UES Exact Terminal Finding Readback

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      project:
        description: RP project
        required: true
        type: choice
        options: [RP01, RP02, RP03, RP04]
      workstream:
        description: Exact logical workstream
        required: true
        type: string

permissions:
  contents: read

jobs:
  authorize:
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.number == 191 && github.actor == 'hamad933' && startsWith(github.event.comment.body, '/ues-exact-terminal-finding-readback ')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      project: ${{ steps.command.outputs.project }}
      workstream: ${{ steps.command.outputs.workstream }}
    steps:
      - name: Authorize exact bounded finding-readback command
        id: command
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          INPUT_PROJECT: ${{ inputs.project || '' }}
          INPUT_WORKSTREAM: ${{ inputs.workstream || '' }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re
          allowed = {"RP01", "RP02", "RP03", "RP04"}
          workstream_re = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$")
          if os.environ["EVENT_NAME"] == "issue_comment":
              match = re.fullmatch(r"/ues-exact-terminal-finding-readback (RP01|RP02|RP03|RP04) ([A-Za-z0-9][A-Za-z0-9._:-]{0,127})", os.environ["COMMENT_BODY"].strip())
              if not match:
                  raise SystemExit("exact owner finding-readback command required")
              project, workstream = match.groups()
          else:
              project = os.environ["INPUT_PROJECT"].strip().upper()
              workstream = os.environ["INPUT_WORKSTREAM"].strip()
              if project not in allowed or not workstream_re.fullmatch(workstream):
                  raise SystemExit("unsupported exact finding-readback request")
          print(f"project={project}")
          print(f"workstream={workstream}")
          PY

  readback:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ues-exact-terminal-finding-${{ needs.authorize.outputs.project }}-${{ needs.authorize.outputs.workstream }}
      # This workflow is strictly GET-only against durable state. A newer exact read
      # supersedes an older stuck read for the same workstream and may cancel it safely.
      cancel-in-progress: true
    steps:
      - name: Checkout governed default branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UES
        run: python -m pip install -e .

      - name: Run exact sanitized terminal finding readback
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UES_ALLOW_PUBLIC_SAME_REPO_STATE: "true"
          UES_STATE_REF_PREFIX: ues-runtime/v2
          PROJECT: ${{ needs.authorize.outputs.project }}
          WORKSTREAM: ${{ needs.authorize.outputs.workstream }}
        run: |
          python -m ues.exact_terminal_finding_readback "$PROJECT" "$WORKSTREAM" | tee "$RUNNER_TEMP/ues-exact-terminal-finding.json"

      - name: Preserve sanitized exact finding receipt
        uses: actions/upload-artifact@v4
        with:
          name: ues-exact-terminal-finding-${{ needs.authorize.outputs.project }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ues-exact-terminal-finding.json
          retention-days: 7
          if-no-files-found: error
