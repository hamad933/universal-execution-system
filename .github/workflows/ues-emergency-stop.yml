name: UES Emergency Stop

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  stop-all-other-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel every other active UES workflow run
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const statuses = ['in_progress', 'queued', 'pending', 'waiting', 'requested'];
            for (let pass = 0; pass < 5; pass++) {
              const targets = [];
              for (const status of statuses) {
                const response = await github.rest.actions.listWorkflowRunsForRepo({
                  owner,
                  repo,
                  status,
                  per_page: 100,
                });
                for (const run of response.data.workflow_runs || []) {
                  if (run.id !== context.runId) targets.push(run);
                }
              }
              const unique = [...new Map(targets.map(run => [run.id, run])).values()];
              core.info(`shutdown pass ${pass + 1}: ${unique.map(r => r.id + ':' + r.name + ':' + r.status).join(',') || 'none'}`);
              for (const run of unique) {
                try {
                  await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
                  core.info(`cancel requested: ${run.id} ${run.name}`);
                } catch (error) {
                  if (error && (error.status === 409 || error.status === 404)) {
                    core.info(`cancel raced terminal state: ${run.id}`);
                  } else {
                    throw error;
                  }
                }
              }
              if (unique.length === 0 && pass >= 1) break;
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
