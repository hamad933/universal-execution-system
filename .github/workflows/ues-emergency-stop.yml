name: UES Emergency Stop

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  stop-all-other-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel every other active UES workflow run
        uses: actions/github-script@v7
        with:
          script: |
            const active = new Set(['queued', 'in_progress', 'waiting', 'pending', 'requested']);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            for (let pass = 0; pass < 8; pass++) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner,
                repo,
                per_page: 100,
              });
              const targets = runs.filter(run => run.id !== context.runId && active.has(run.status));
              core.info(`shutdown pass ${pass + 1}: active targets=${targets.map(r => r.id + ':' + r.name + ':' + r.status).join(',') || 'none'}`);
              for (const run of targets) {
                try {
                  await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
                  core.info(`cancel requested: ${run.id} ${run.name}`);
                } catch (error) {
                  if (error && (error.status === 409 || error.status === 404)) {
                    core.info(`cancel raced terminal state: ${run.id}`);
                  } else {
                    throw error;
                  }
                }
              }
              if (targets.length === 0 && pass >= 1) break;
              await new Promise(resolve => setTimeout(resolve, 3000));
            }
            const finalRuns = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner,
              repo,
              per_page: 100,
            });
            const leftovers = finalRuns.filter(run => run.id !== context.runId && active.has(run.status));
            if (leftovers.length) {
              core.setFailed('UES emergency stop left active runs: ' + leftovers.map(r => r.id + ':' + r.name + ':' + r.status).join(','));
            } else {
              core.info('UES emergency stop verified: no other active runs remain.');
            }
