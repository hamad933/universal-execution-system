name: UES Bounded Existing Session Continuation

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: ues-bounded-existing-session-main
  cancel-in-progress: false

jobs:
  cep-waiting-continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout governed UES main runtime
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UES
        run: python -m pip install -e .

      - name: Execute only policy-authorized existing-session CEP waiting continuations
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          UES_ALLOW_PUBLIC_SAME_REPO_STATE: "true"
          UES_STATE_REF_PREFIX: ues-runtime/v2
        run: python -m ues.bounded_waiting_runtime CEP
