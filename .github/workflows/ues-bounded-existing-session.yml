name: UES Portfolio Lineage Lifecycle

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project to reconcile
        required: true
        type: choice
        default: ALL
        options:
          - ALL
          - CEP
          - GS
      current_authority_json:
        description: Bounded controller-attested current authority envelope
        required: false
        type: string
      wakeup_type:
        description: Allowlisted lifecycle wakeup type
        required: false
        type: string
        default: EXTERNAL_RECONCILIATION_REQUEST
      wakeup_event_id:
        description: Stable upstream event id for coalescing
        required: false
        type: string
  repository_dispatch:
    types: [ues-lifecycle-wakeup]
  push:
    branches:
      - main
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  provider-observer-fallback:
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    concurrency:
      group: ues-provider-observer-fallback
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout governed UES runtime
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UES
        run: python -m pip install -e .

      - name: Recover stale provider observation read-only when needed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          UES_ALLOW_PUBLIC_SAME_REPO_STATE: "true"
          UES_STATE_REF_PREFIX: ues-runtime/v2
          UES_PROVIDER_OBSERVER_FALLBACK_STALE_SECONDS: "1200"
        run: python -m ues.provider_observer_recovery

  project-lineage-cycle:
    if: >-
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["ALL","CEP","GS"]'), inputs.project)) ||
      (github.event_name == 'repository_dispatch' && contains(fromJSON('["CEP","GS"]'), github.event.client_payload.project))
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        project: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.project == 'ALL' && '["CEP","GS"]' || format('["{0}"]', github.event_name == 'repository_dispatch' && github.event.client_payload.project || inputs.project)) }}
    concurrency:
      group: ues-project-lifecycle-${{ matrix.project }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout governed UES runtime
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UES
        run: python -m pip install -e .

      - name: Run integrated current-authority logical lineage lifecycle
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          UES_ALLOW_PUBLIC_SAME_REPO_STATE: "true"
          UES_STATE_REF_PREFIX: ues-runtime/v2
          UES_AUTHORITY_TRANSPORT_ACTOR: ${{ github.actor }}
          UES_CURRENT_AUTHORITY_JSON: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload.current_authority) || inputs.current_authority_json || '' }}
          UES_WAKEUP_EVENT_ID: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.event_id || inputs.wakeup_event_id || '' }}
          UES_WAKEUP_EVENT_TYPE: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.event_type || (github.event_name == 'workflow_dispatch' && inputs.wakeup_type) || '' }}
          UES_WAKEUP_EVENT_SOURCE: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.source || github.event_name }}
          UES_WAKEUP_REPOSITORY: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.repository || '' }}
          UES_WAKEUP_WORKSTREAM: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.workstream || '' }}
          UES_WAKEUP_SHA: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.sha || '' }}
        run: python -m ues.lifecycle_runtime_observed ${{ matrix.project }}

      - name: Run guarded initial logical lineage creation/reconciliation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          UES_ALLOW_PUBLIC_SAME_REPO_STATE: "true"
          UES_STATE_REF_PREFIX: ues-runtime/v2
          UES_AUTHORITY_TRANSPORT_ACTOR: ${{ github.actor }}
          UES_CURRENT_AUTHORITY_JSON: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload.current_authority) || inputs.current_authority_json || '' }}
        run: python -m ues.initial_lineage_runtime ${{ matrix.project }}
