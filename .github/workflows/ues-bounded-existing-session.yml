name: UES Portfolio Lineage Lifecycle

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  project-lineage-cycle:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        project: [CEP, GS]
    concurrency:
      group: ues-lineage-lifecycle-${{ matrix.project }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout governed UES main runtime
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UES
        run: python -m pip install -e .

      - name: Run logical Writer Reviewer lifecycle
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          UES_ALLOW_PUBLIC_SAME_REPO_STATE: "true"
          UES_STATE_REF_PREFIX: ues-runtime/v2
        run: python -m ues.lifecycle_runtime ${{ matrix.project }}
