name: UES Live Runtime Foundation

on:
  push:
    branches:
      - main
      - work/ues-auto-v2-k-live-runtime-foundation
      - work/ues-auto-v2-live-provider-observer-r1
      - work/ues-auto-v2-provider-observer-recovery-r1
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: ues-live-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate-proof:
    if: github.event_name != 'schedule' && github.ref != 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UES
        run: python -m pip install -e .

      - name: Full repository tests
        run: python -m unittest discover -s tests -v

      - name: Live same-repository StateStore proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UES_ALLOW_PUBLIC_SAME_REPO_STATE: "true"
          UES_STATE_REF_PREFIX: ues-runtime/candidate/${{ github.ref_name }}
        run: python -m ues.live_runtime state-smoke

      - name: Live runtime watchdog audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UES_ALLOW_PUBLIC_SAME_REPO_STATE: "true"
          UES_STATE_REF_PREFIX: ues-runtime/candidate/${{ github.ref_name }}
        run: python -m ues.live_runtime state-audit

      - name: Check Jules secret availability without disclosure
        id: jules_secret
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          if [ -n "$JULES_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Jules credential read-only probe
        id: jules_probe
        if: steps.jules_secret.outputs.present == 'true'
        continue-on-error: true
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: python -m ues.live_runtime jules-probe

      - name: Jules GS/CEP resilient live read-only provider observation
        if: steps.jules_secret.outputs.present == 'true' && steps.jules_probe.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          UES_ALLOW_PUBLIC_SAME_REPO_STATE: "true"
          UES_STATE_REF_PREFIX: ues-runtime/candidate/${{ github.ref_name }}
        run: python -m ues.provider_observer_runtime observe

      - name: Persist sanitized Jules probe success proof
        if: steps.jules_secret.outputs.present == 'true' && steps.jules_probe.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UES_ALLOW_PUBLIC_SAME_REPO_STATE: "true"
          UES_STATE_REF_PREFIX: ues-runtime/candidate/${{ github.ref_name }}
        run: python -m ues.live_runtime record-jules-probe

      - name: Persist sanitized Jules probe failure status
        if: steps.jules_secret.outputs.present != 'true' || steps.jules_probe.outcome != 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UES_ALLOW_PUBLIC_SAME_REPO_STATE: "true"
          UES_STATE_REF_PREFIX: ues-runtime/candidate/${{ github.ref_name }}
          JULES_SECRET_PRESENT: ${{ steps.jules_secret.outputs.present }}
        run: |
          python - <<'PY'
          import os
          from hashlib import sha256
          from ues.identity import canonical_lane_id
          from ues.live_runtime import build_live_state_store, _iso, _utc_now
          from ues.state_store import OperationRecord, StateUnavailable

          repository = os.environ['GITHUB_REPOSITORY']
          secret_present = os.environ.get('JULES_SECRET_PRESENT', '').strip().lower() == 'true'
          classification = (
              'PROVIDER_AUTH_OR_READ_FAILURE'
              if secret_present
              else 'JULES_API_KEY_NOT_AVAILABLE_TO_WORKFLOW'
          )
          store = build_live_state_store()
          lane_id = canonical_lane_id('UES', 'INTERNAL:UES', 'LIVE-RUNTIME-PROBE')
          lane = store.read_workstream(lane_id)
          if lane.status != 'OK' or lane.record is None:
              raise StateUnavailable(lane.reason or 'live probe lane unavailable')
          operation_key = 'ues-v2:jules-read-only-probe-failure:' + sha256(
              f'{repository}|jules-read-only-probe-failure-v1'.encode('utf-8')
          ).hexdigest()
          current = store.read_operation(operation_key)
          now = _iso(_utc_now())
          receipt = {
              'result': 'JULES_READ_ONLY_AUTHENTICATION_NOT_PROVEN',
              'classification': classification,
              'credential_present_to_workflow': secret_present,
              'read_only': True,
              'provider_mutation': False,
              'exception_text_persisted': False,
              'session_identity_persisted': False,
          }
          if current.status == 'MISSING':
              record = OperationRecord(
                  operation_key=operation_key,
                  lane_id=lane_id,
                  workstream_id='LIVE-RUNTIME-PROBE',
                  action='jules-read-only-authentication-probe-failure',
                  request_digest=sha256(b'JULES_READ_ONLY_AUTH_PROBE_FAILURE_V1').hexdigest(),
                  state='REJECTED',
                  owner='ues-live-runtime',
                  started_at=now,
                  updated_at=now,
                  receipt=receipt,
              )
              store.compare_and_swap_operation(operation_key, 0, record)
          elif current.status == 'OK' and current.record is not None:
              record = OperationRecord.from_dict(current.record.to_dict())
              record.state = 'REJECTED'
              record.updated_at = now
              record.receipt = receipt
              store.compare_and_swap_operation(operation_key, current.version, record)
          else:
              raise StateUnavailable(current.reason or 'Jules probe failure status unavailable')
          print('{"result":"JULES_PROBE_FAILURE_STATUS_PERSISTED","secret_emitted":false}')
          PY

      - name: Enforce Jules read-only proof gate
        if: steps.jules_secret.outputs.present != 'true' || steps.jules_probe.outcome != 'success'
        run: |
          echo "Jules read-only authentication proof was not established; see sanitized durable status."
          exit 1

  scheduled-provider-observer:
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout governed default-branch runtime
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UES
        run: python -m pip install -e .

      - name: Observe Jules GS/CEP sessions read-only with durable health
        id: provider_observer
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          UES_ALLOW_PUBLIC_SAME_REPO_STATE: "true"
          UES_STATE_REF_PREFIX: ues-runtime/v2
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 720s \
            python -m ues.provider_observer_runtime observe > provider-observer-result.json
          rc=$?
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            python - <<'PY' > provider-observer-result.json
          import json
          print(json.dumps({
              "schema_version": "1.0",
              "result": "JULES_PROVIDER_OBSERVATION_BUDGET_EXHAUSTED",
              "cycle_status": "CONTROL_CYCLE_FAILED",
              "scan_complete": False,
              "provider_read_complete": False,
              "state_persistence_complete": False,
              "state_persistence_outcome": "UNKNOWN_REQUIRES_AUTHORITATIVE_POST_READBACK",
              "provider_mutation_performed": False,
              "external_effects_dispatched": 0,
              "new_tasks_or_sessions_created": 0,
              "safe_to_blind_retry": False,
              "wall_clock_budget_seconds": 720,
              "raw_activity_content_persisted": False,
              "raw_session_ids_persisted": False,
              "raw_titles_persisted": False,
              "exception_text_persisted": False,
          }, sort_keys=True))
          PY
            rc=2
          fi
          exit "$rc"

      - name: Preserve provider observer execution receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ues-provider-observer-${{ github.run_id }}
          path: provider-observer-result.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce provider observer result
        if: steps.provider_observer.outcome != 'success'
        run: |
          echo "Provider observer did not complete successfully; durable receipt was preserved and authoritative audit/fallback may continue."
          exit 1

  scheduled-lifecycle-health-fallback:
    if: always() && github.event_name == 'schedule' && needs.scheduled-provider-observer.result != 'success'
    needs: scheduled-provider-observer
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        project: [CEP, GS]
    concurrency:
      group: ues-lineage-lifecycle-${{ matrix.project }}
      cancel-in-progress: false
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout governed default-branch runtime
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UES
        run: python -m pip install -e .

      - name: Run authority-neutral lifecycle health fallback
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          UES_ALLOW_PUBLIC_SAME_REPO_STATE: "true"
          UES_STATE_REF_PREFIX: ues-runtime/v2
          UES_CURRENT_AUTHORITY_JSON: ""
          UES_WAKEUP_EVENT_ID: ""
          UES_WAKEUP_EVENT_TYPE: ""
          UES_WAKEUP_EVENT_SOURCE: provider-observer-schedule-fallback
          UES_WAKEUP_REPOSITORY: ""
          UES_WAKEUP_WORKSTREAM: ""
          UES_WAKEUP_SHA: ""
        run: python -m ues.lifecycle_runtime_observed ${{ matrix.project }}

  scheduled-provider-audit:
    if: always() && (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    needs: scheduled-provider-observer
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout governed default-branch runtime
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UES
        run: python -m pip install -e .

      - name: Audit fresh provider observations and surface attention states
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UES_ALLOW_PUBLIC_SAME_REPO_STATE: "true"
          UES_STATE_REF_PREFIX: ues-runtime/v2
        run: python -m ues.provider_observer_runtime audit

  scheduled-watchdog:
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout governed default-branch runtime
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UES
        run: python -m pip install -e .

      - name: Audit durable runtime lanes and operations
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UES_ALLOW_PUBLIC_SAME_REPO_STATE: "true"
          UES_STATE_REF_PREFIX: ues-runtime/v2
        run: python -m ues.live_runtime state-audit
