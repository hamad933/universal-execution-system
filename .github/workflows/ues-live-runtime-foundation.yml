name: UES Live Runtime Foundation

on:
  push:
    branches:
      - work/ues-auto-v2-k-live-runtime-foundation
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: ues-live-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate-proof:
    if: github.event_name != 'schedule'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UES
        run: python -m pip install -e .

      - name: Full repository tests
        run: python -m unittest discover -s tests -v

      - name: Live same-repository StateStore proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UES_ALLOW_PUBLIC_SAME_REPO_STATE: "true"
          UES_STATE_REF_PREFIX: ues-runtime/v2
        run: python -m ues.live_runtime state-smoke

      - name: Live runtime watchdog audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UES_ALLOW_PUBLIC_SAME_REPO_STATE: "true"
          UES_STATE_REF_PREFIX: ues-runtime/v2
        run: python -m ues.live_runtime state-audit

      - name: Jules credential read-only probe
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: python -m ues.live_runtime jules-probe

  scheduled-watchdog:
    if: github.event_name == 'schedule'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout governed default-branch runtime
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UES
        run: python -m pip install -e .

      - name: Audit durable runtime lanes and operations
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UES_ALLOW_PUBLIC_SAME_REPO_STATE: "true"
          UES_STATE_REF_PREFIX: ues-runtime/v2
        run: python -m ues.live_runtime state-audit
