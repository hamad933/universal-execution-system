name: Validate Universal Core

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Capture exact checked-out HEAD
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Exercise exact-SHA preflight
        run: python -m ues.cli preflight --repo . --expected-sha "${{ steps.head.outputs.sha }}"
      - name: Validate JSON protocol files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = (
              list(Path('protocol').glob('*.json'))
              + list(Path('examples').glob('*.json'))
              + list(Path('adapters').glob('*.json'))
          )
          for path in paths:
              json.loads(path.read_text(encoding='utf-8'))
              print(f'valid-json: {path}')
          PY
      - name: Validate example project contract
        run: python -m ues.cli validate-contract examples/project.contract.json
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run R2 production-backed integration mode
        env:
          UES_CONTROL_PLANE_INTEGRATION: '1'
        run: python -m unittest discover -s tests/control_plane -p 'test_*.py' -v
      - name: Exercise capability discovery
        run: python -m ues.cli detect --repo .
      - name: Exercise adapter planning
        run: python -m ues.adapter_cli --repo . --contract examples/project.contract.json
      - name: Exercise resource advisory
        run: python -m ues.cli resource-advice examples/resource.metrics.json
      - name: Exercise read-only exec bridge
        run: |
          python -m ues.bridge_cli \
            --comment "/exec preflight" \
            --repo . \
            --repository "$GITHUB_REPOSITORY" \
            --workstream-id "CI-SMOKE" \
            --operation-id "run-$GITHUB_RUN_ID" \
            --expected-sha "${{ steps.head.outputs.sha }}"
          python -m ues.bridge_cli \
            --comment "/exec adapter-plan contract=examples/project.contract.json" \
            --repo . \
            --repository "$GITHUB_REPOSITORY" \
            --workstream-id "CI-SMOKE" \
            --operation-id "run-$GITHUB_RUN_ID-adapter" \
            --expected-sha "${{ steps.head.outputs.sha }}"

  parent-controller-relay:
    name: Parent Controller trusted dispatch relay
    needs: core
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'ues-parent-control' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Verify exact Owner control request and dispatch trusted receiver
        uses: actions/github-script@v7
        env:
          CONTROL_HEAD: ${{ github.event.pull_request.head.sha }}
          VALIDATION_RUN_ID: ${{ github.run_id }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const expectedRepo = `${context.repo.owner}/${context.repo.repo}`;
            const requestPath = '.ues/parent-controller-request.json';
            const defaultBranch = context.payload.repository.default_branch;

            if (!pr || pr.state !== 'open' || pr.draft !== true) {
              core.setFailed('Parent Controller relay requires the persistent OPEN/DRAFT control PR');
              return;
            }
            if (!pr.head.repo || pr.head.repo.full_name !== expectedRepo || pr.head.ref !== 'ues-parent-control') {
              core.setFailed('Parent Controller relay requires same-repository ues-parent-control');
              return;
            }
            if (pr.base.ref !== defaultBranch || !context.payload.sender || context.payload.sender.login !== context.repo.owner) {
              core.setFailed('Parent Controller relay requires Owner-triggered PR synchronization against default branch');
              return;
            }
            const exactHead = String(process.env.CONTROL_HEAD || '').toLowerCase();
            if (!/^[0-9a-f]{40}$/.test(exactHead) || exactHead !== String(pr.head.sha || '').toLowerCase()) {
              core.setFailed('Parent Controller relay requires exact live control head');
              return;
            }

            const prFiles = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            if (prFiles.length !== 1 || prFiles[0].filename !== requestPath) {
              core.setFailed('Persistent Parent Controller PR must contain only the semantic request file');
              return;
            }
            const { data: commit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: exactHead,
            });
            if (!commit.author || commit.author.login !== context.repo.owner ||
                !commit.committer || commit.committer.login !== context.repo.owner) {
              core.setFailed('Parent Controller request commit must be Owner-authored and committed');
              return;
            }
            const changed = commit.files || [];
            if (changed.length !== 1 || changed[0].filename !== requestPath) {
              core.setFailed('Parent Controller request commit must change only the semantic request file');
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ues-parent-controller-dispatch.yml',
              ref: defaultBranch,
              inputs: {
                control_head: exactHead,
                validation_run_id: String(process.env.VALIDATION_RUN_ID || ''),
                control_pr_number: String(pr.number),
              },
            });
