name: UES Evidence Supplement Terminal Consumer

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      project:
        required: true
        type: choice
        options: [RP01, RP02, RP03, RP04]
      workstream:
        required: true
        type: string

permissions:
  contents: read

jobs:
  authorize:
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.number == 72 && github.actor == 'hamad933') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      project: ${{ steps.command.outputs.project }}
      workstream: ${{ steps.command.outputs.workstream }}
    steps:
      - id: command
        name: Authorize exact supplement terminal command
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          INPUT_PROJECT: ${{ inputs.project || '' }}
          INPUT_WORKSTREAM: ${{ inputs.workstream || '' }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re
          if os.environ["EVENT_NAME"] == "issue_comment":
              m = re.fullmatch(r"/ues-supplement-terminal (RP01|RP02|RP03|RP04) ([A-Za-z0-9][A-Za-z0-9._:-]{0,127})", os.environ["COMMENT_BODY"].strip())
              if not m:
                  raise SystemExit("exact owner supplement-terminal command required")
              project, workstream = m.groups()
          else:
              project = os.environ["INPUT_PROJECT"].strip().upper()
              workstream = os.environ["INPUT_WORKSTREAM"].strip()
              if project not in {"RP01","RP02","RP03","RP04"} or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._:-]{0,127}", workstream):
                  raise SystemExit("invalid project/workstream")
          print(f"project={project}")
          print(f"workstream={workstream}")
          PY

  consume:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ues-evidence-supplement-terminal-${{ needs.authorize.outputs.project }}-${{ needs.authorize.outputs.workstream }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Consume exact private evidence supplement GET-only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          UES_ALLOW_PUBLIC_SAME_REPO_STATE: "true"
          UES_STATE_REF_PREFIX: ues-runtime/v2
          PROJECT: ${{ needs.authorize.outputs.project }}
          WORKSTREAM: ${{ needs.authorize.outputs.workstream }}
        run: |
          set +e
          python -m ues.evidence_supplement_terminal "$PROJECT" "$WORKSTREAM" > "$RUNNER_TEMP/ues-evidence-supplement-terminal.json"
          status=$?
          set -e
          cat "$RUNNER_TEMP/ues-evidence-supplement-terminal.json"
          exit "$status"
      - name: Preserve sanitized supplement receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ues-evidence-supplement-terminal-${{ needs.authorize.outputs.project }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ues-evidence-supplement-terminal.json
          retention-days: 7
          if-no-files-found: error
