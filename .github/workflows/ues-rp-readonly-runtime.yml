name: UES RP Read-Only Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

jobs:
  provider-observer:
    concurrency:
      group: ues-rp-provider-observer
      cancel-in-progress: false
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout governed default branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UES
        run: python -m pip install -e .

      - name: Observe RP Jules sessions read-only
        id: observe
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          UES_ALLOW_PUBLIC_SAME_REPO_STATE: "true"
          UES_STATE_REF_PREFIX: ues-runtime/v2
          UES_PROVIDER_ACTIVITY_READ_WORKERS: "8"
          UES_PROVIDER_OBSERVER_INNER_TIMEOUT: "24m"
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s "$UES_PROVIDER_OBSERVER_INNER_TIMEOUT" \
            python -m ues.rp_readonly_runtime observe-provider > "$RUNNER_TEMP/rp-provider-observer-runtime.json"
          status=$?
          export UES_OBSERVER_COMMAND_STATUS="$status"
          set -e
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          source = Path(os.environ["RUNNER_TEMP"]) / "rp-provider-observer-runtime.json"
          destination = Path(os.environ["RUNNER_TEMP"]) / "rp-provider-observer-public-receipt.json"
          command_status = int(os.environ.get("UES_OBSERVER_COMMAND_STATUS", "1"))
          allowed = (
              "schema_version",
              "result",
              "error_category",
              "provider_read_complete",
              "state_persistence_complete",
              "provider_mutation_performed",
              "new_tasks_or_sessions_created",
              "external_effects_dispatched",
              "safe_to_blind_retry",
          )
          payload = {}
          try:
              raw = json.loads(source.read_text(encoding="utf-8"))
              if isinstance(raw, dict):
                  payload = {key: raw.get(key) for key in allowed if key in raw}
          except Exception:
              payload = {}
          internal_deadline_exceeded = command_status == 124
          receipt = {
              "schema_version": "UES_RP_PROVIDER_OBSERVER_PUBLIC_RECEIPT_V1",
              "runtime_result": (
                  "RUNTIME_INTERNAL_DEADLINE_EXCEEDED"
                  if internal_deadline_exceeded and not payload
                  else payload.get("result", "RUNTIME_OUTPUT_UNAVAILABLE")
              ),
              "error_category": (
                  "PROVIDER_OBSERVER_INTERNAL_DEADLINE_EXCEEDED"
                  if internal_deadline_exceeded and not payload
                  else payload.get("error_category")
              ),
              "provider_read_complete": payload.get("provider_read_complete"),
              "state_persistence_complete": payload.get("state_persistence_complete"),
              "provider_mutation_performed": bool(payload.get("provider_mutation_performed", False)),
              "new_tasks_or_sessions_created": int(payload.get("new_tasks_or_sessions_created") or 0),
              "external_effects_dispatched": int(payload.get("external_effects_dispatched") or 0),
              "safe_to_blind_retry": bool(payload.get("safe_to_blind_retry", False)),
              "recovery_snapshot_persisted": False,
              "findings_persisted": False,
              "raw_activity_content_persisted": False,
              "raw_session_ids_persisted": False,
              "raw_titles_persisted": False,
              "secret_material_persisted": False,
          }
          destination.write_text(json.dumps(receipt, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(receipt, sort_keys=True))
          PY
          exit "$status"

      - name: Preserve sanitized RP observer receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ues-rp-provider-observer-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/rp-provider-observer-public-receipt.json
          retention-days: 7
          if-no-files-found: error

  lifecycle-health:
    if: always()
    needs: provider-observer
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        project: [RP01, RP02, RP03, RP04]
    concurrency:
      group: ues-rp-readonly-lifecycle-${{ matrix.project }}
      cancel-in-progress: false
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout governed default branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UES
        run: python -m pip install -e .

      - name: Run authority-neutral RP lifecycle health
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          UES_ALLOW_PUBLIC_SAME_REPO_STATE: "true"
          UES_STATE_REF_PREFIX: ues-runtime/v2
          UES_CURRENT_AUTHORITY_JSON: ""
          UES_WAKEUP_EVENT_ID: ""
          UES_WAKEUP_EVENT_TYPE: ""
          UES_WAKEUP_EVENT_SOURCE: rp-readonly-${{ github.event_name }}
          UES_WAKEUP_REPOSITORY: ""
          UES_WAKEUP_WORKSTREAM: ""
          UES_WAKEUP_SHA: ""
        run: python -m ues.rp_readonly_runtime lifecycle-health ${{ matrix.project }}

  provider-audit:
    if: always()
    needs: provider-observer
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout governed default branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UES
        run: python -m pip install -e .

      - name: Audit RP provider observations
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UES_ALLOW_PUBLIC_SAME_REPO_STATE: "true"
          UES_STATE_REF_PREFIX: ues-runtime/v2
        run: python -m ues.rp_readonly_runtime audit-provider
