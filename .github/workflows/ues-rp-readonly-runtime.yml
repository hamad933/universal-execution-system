name: UES RP Read-Only Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

concurrency:
  group: ues-rp-readonly-runtime
  cancel-in-progress: false

jobs:
  provider-observer:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout governed default branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UES
        run: python -m pip install -e .

      - name: Observe RP Jules sessions read-only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          UES_ALLOW_PUBLIC_SAME_REPO_STATE: "true"
          UES_STATE_REF_PREFIX: ues-runtime/v2
        run: python -m ues.rp_readonly_runtime observe-provider

  lifecycle-health:
    needs: provider-observer
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        project: [RP01, RP02, RP03, RP04]
    concurrency:
      group: ues-project-lifecycle-${{ matrix.project }}
      cancel-in-progress: false
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout governed default branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UES
        run: python -m pip install -e .

      - name: Run authority-neutral RP lifecycle health
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          UES_ALLOW_PUBLIC_SAME_REPO_STATE: "true"
          UES_STATE_REF_PREFIX: ues-runtime/v2
          UES_CURRENT_AUTHORITY_JSON: ""
          UES_WAKEUP_EVENT_ID: ""
          UES_WAKEUP_EVENT_TYPE: ""
          UES_WAKEUP_EVENT_SOURCE: rp-readonly-${{ github.event_name }}
          UES_WAKEUP_REPOSITORY: ""
          UES_WAKEUP_WORKSTREAM: ""
          UES_WAKEUP_SHA: ""
        run: python -m ues.rp_readonly_runtime lifecycle-health ${{ matrix.project }}

  provider-audit:
    if: always()
    needs: provider-observer
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout governed default branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UES
        run: python -m pip install -e .

      - name: Audit RP provider observations
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UES_ALLOW_PUBLIC_SAME_REPO_STATE: "true"
          UES_STATE_REF_PREFIX: ues-runtime/v2
        run: python -m ues.rp_readonly_runtime audit-provider
