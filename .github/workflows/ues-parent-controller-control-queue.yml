name: UES Parent Controller Control Queue

on:
  pull_request_target:
    types: [synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: ues-parent-controller-control-queue-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.head.ref == 'ues-parent-control' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.base.ref == github.event.repository.default_branch) ||
      (github.event_name == 'issue_comment' &&
       github.event.action == 'created' &&
       github.event.issue.pull_request != null)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      runtime_sha: ${{ steps.control.outputs.runtime_sha }}
      request_file_sha: ${{ steps.control.outputs.request_file_sha }}
      control_pr_number: ${{ steps.control.outputs.control_pr_number }}
      trigger_kind: ${{ steps.control.outputs.trigger_kind }}
      trigger_comment_id: ${{ steps.control.outputs.trigger_comment_id }}
      project: ${{ steps.metadata.outputs.project }}
      request_id: ${{ steps.metadata.outputs.request_id }}
      wakeup_type: ${{ steps.metadata.outputs.wakeup_type }}
      wakeup_event_id: ${{ steps.metadata.outputs.wakeup_event_id }}
      wakeup_repository: ${{ steps.metadata.outputs.wakeup_repository }}
      wakeup_workstream: ${{ steps.metadata.outputs.wakeup_workstream }}
      wakeup_sha: ${{ steps.metadata.outputs.wakeup_sha }}
    steps:
      - name: Resolve exact trusted runtime and isolated control request
        id: control
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const expectedRepo = `${context.repo.owner}/${context.repo.repo}`;
            const defaultBranch = context.payload.repository.default_branch;
            const requestPath = '.ues/parent-controller-request.json';
            const isCommentTrigger = context.eventName === 'issue_comment';
            let control;
            let controlPrNumber;
            let triggerCommentId = '';

            if (isCommentTrigger) {
              if (!context.payload.issue || !context.payload.issue.pull_request) {
                core.setFailed('Parent Controller comment trigger must target a pull request');
                return;
              }
              controlPrNumber = Number(context.payload.issue.number);
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: controlPrNumber,
              });
              control = pr;
              if (!context.payload.sender || context.payload.sender.login !== context.repo.owner) {
                core.setFailed('Parent Controller trigger comment must be authored by the repository Owner');
                return;
              }
              const firstLine = String(context.payload.comment?.body || '')
                .split(/\r?\n/)
                .find(line => line.trim())?.trim() || '';
              const match = firstLine.match(/^\/ues-parent submit head=([0-9a-f]{40})$/i);
              if (!match || match[1].toLowerCase() !== String(control.head.sha || '').toLowerCase()) {
                core.setFailed('Parent Controller trigger comment must bind the exact live control head SHA');
                return;
              }
              const created = Date.parse(context.payload.comment?.created_at || '');
              const ageMs = Date.now() - created;
              if (!Number.isFinite(created) || ageMs < 0 || ageMs >= 14 * 60 * 1000) {
                core.setFailed('Parent Controller trigger comment is expired or invalid');
                return;
              }
              triggerCommentId = String(context.payload.comment?.id || '');
            } else {
              control = context.payload.pull_request;
              controlPrNumber = Number(control?.number);
              if (!context.payload.sender || context.payload.sender.login !== context.repo.owner) {
                core.setFailed('Parent Controller queue synchronize event must be triggered by the repository Owner');
                return;
              }
              const before = String(context.payload.before || '').toLowerCase();
              if (!/^[0-9a-f]{40}$/.test(before)) {
                core.setFailed('Parent Controller synchronize event is missing exact prior head');
                return;
              }
              const { data: eventDelta } = await github.rest.repos.compareCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                base: before,
                head: control.head.sha,
              });
              const eventFiles = eventDelta.files || [];
              if (eventFiles.length !== 1 || eventFiles[0].filename !== requestPath) {
                core.setFailed('Parent Controller synchronize delta must change only .ues/parent-controller-request.json');
                return;
              }
            }

            if (!Number.isInteger(controlPrNumber) || controlPrNumber <= 0 || control.state !== 'open') {
              core.setFailed('Parent Controller control PR must be open');
              return;
            }
            if (!control.head.repo || control.head.repo.full_name !== expectedRepo || control.head.ref !== 'ues-parent-control') {
              core.setFailed('Parent Controller queue requires same-repository ues-parent-control branch');
              return;
            }
            if (control.base.ref !== defaultBranch) {
              core.setFailed('Parent Controller queue must target the repository default branch');
              return;
            }

            const prFiles = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: controlPrNumber,
              per_page: 100,
            });
            if (prFiles.length !== 1 || prFiles[0].filename !== requestPath) {
              core.setFailed('Persistent Parent Controller control PR must contain only .ues/parent-controller-request.json');
              return;
            }

            const { data: liveBase } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: defaultBranch,
            });
            const runtimeSha = String(liveBase.commit.sha || '').toLowerCase();
            if (!/^[0-9a-f]{40}$/.test(runtimeSha)) {
              core.setFailed('Unable to resolve exact live UES default-branch SHA');
              return;
            }

            const { data: controlCommit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: control.head.sha,
            });
            if (!controlCommit.author || controlCommit.author.login !== context.repo.owner ||
                !controlCommit.committer || controlCommit.committer.login !== context.repo.owner) {
              core.setFailed('Parent Controller queue commit must be repository-owner authored and committed');
              return;
            }
            const files = controlCommit.files || [];
            if (files.length !== 1 || files[0].filename !== requestPath) {
              core.setFailed('Parent Controller queue commit must change only .ues/parent-controller-request.json');
              return;
            }

            const { data: requestFile } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: requestPath,
              ref: control.head.sha,
            });
            if (Array.isArray(requestFile) || requestFile.type !== 'file' || !requestFile.content) {
              core.setFailed('Parent Controller request file is missing or invalid');
              return;
            }

            if (!isCommentTrigger) {
              const before = String(context.payload.before || '').toLowerCase();
              let previousFileSha = null;
              try {
                const { data: previousFile } = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: requestPath,
                  ref: before,
                });
                if (!Array.isArray(previousFile) && previousFile.type === 'file') {
                  previousFileSha = previousFile.sha;
                }
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              if (previousFileSha && previousFileSha === requestFile.sha) {
                core.setFailed('Parent Controller request file did not change');
                return;
              }
            }

            fs.writeFileSync(
              'parent-controller-request.json',
              Buffer.from(requestFile.content, 'base64').toString('utf8'),
              { encoding: 'utf8', mode: 0o600 },
            );
            core.setOutput('runtime_sha', runtimeSha);
            core.setOutput('request_file_sha', String(requestFile.sha || ''));
            core.setOutput('control_pr_number', String(controlPrNumber));
            core.setOutput('trigger_kind', isCommentTrigger ? 'OWNER_COMMENT_HEAD_BINDING' : 'PR_SYNCHRONIZE');
            core.setOutput('trigger_comment_id', triggerCommentId);

      - name: Checkout exact trusted UES runtime
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.control.outputs.runtime_sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact trusted UES runtime
        run: python -m pip install -e .

      - name: Validate transport and extract governed Current Authority
        run: |
          python -m ues.parent_controller_request \
            --input parent-controller-request.json \
            --expected-runtime-sha '${{ steps.control.outputs.runtime_sha }}' \
            --authority-output current-authority.json \
            --metadata-output parent-request-metadata.json

      - name: Export validated routing metadata
        id: metadata
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          value = json.load(open('parent-request-metadata.json', encoding='utf-8'))
          wakeup = value.get('wakeup') or {}
          for key, item in (
              ('project', value.get('project', '')),
              ('request_id', value.get('request_id', '')),
              ('wakeup_type', wakeup.get('event_type', '')),
              ('wakeup_event_id', wakeup.get('event_id', '')),
              ('wakeup_repository', wakeup.get('repository', '')),
              ('wakeup_workstream', wakeup.get('workstream', '')),
              ('wakeup_sha', wakeup.get('sha', '')),
          ):
              print(f'{key}={item}')
          PY

      - name: Preserve validated request transport
        uses: actions/upload-artifact@v4
        with:
          name: ues-parent-request-${{ steps.control.outputs.request_file_sha }}
          path: |
            current-authority.json
            parent-request-metadata.json
          retention-days: 1
          if-no-files-found: error

  execute:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      issues: write
    concurrency:
      group: ues-project-lifecycle-${{ needs.preflight.outputs.project }}
      cancel-in-progress: false
    steps:
      - name: Checkout exact validated UES runtime
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.runtime_sha }}
          persist-credentials: false

      - name: Reverify validated runtime is still current before effects
        uses: actions/github-script@v7
        env:
          EXPECTED_RUNTIME_SHA: ${{ needs.preflight.outputs.runtime_sha }}
        with:
          script: |
            const { data: liveBase } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: context.payload.repository.default_branch,
            });
            const liveSha = String(liveBase.commit.sha || '').toLowerCase();
            const expectedSha = String(process.env.EXPECTED_RUNTIME_SHA || '').toLowerCase();
            if (liveSha !== expectedSha) {
              core.setFailed('UES default branch moved after preflight; submit a fresh request bound to the current runtime');
            }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact validated UES runtime
        run: python -m pip install -e .

      - name: Restore validated Parent Controller request
        uses: actions/download-artifact@v4
        with:
          name: ues-parent-request-${{ needs.preflight.outputs.request_file_sha }}
          path: .

      - name: Run authority-gated project lifecycle and guarded initial-lineage runtime
        id: runtime
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          UES_ALLOW_PUBLIC_SAME_REPO_STATE: "true"
          UES_STATE_REF_PREFIX: ues-runtime/v2
          UES_AUTHORITY_TRANSPORT_ACTOR: ${{ github.repository_owner }}
          UES_WAKEUP_EVENT_ID: ${{ needs.preflight.outputs.wakeup_event_id }}
          UES_WAKEUP_EVENT_TYPE: ${{ needs.preflight.outputs.wakeup_type }}
          UES_WAKEUP_EVENT_SOURCE: PARENT_CONTROLLER_CONTROL_QUEUE
          UES_WAKEUP_REPOSITORY: ${{ needs.preflight.outputs.wakeup_repository }}
          UES_WAKEUP_WORKSTREAM: ${{ needs.preflight.outputs.wakeup_workstream }}
          UES_WAKEUP_SHA: ${{ needs.preflight.outputs.wakeup_sha }}
          PROJECT: ${{ needs.preflight.outputs.project }}
        run: |
          set -euo pipefail
          export UES_CURRENT_AUTHORITY_JSON="$(cat current-authority.json)"
          if [[ "$PROJECT" == RP01 || "$PROJECT" == RP02 || "$PROJECT" == RP03 || "$PROJECT" == RP04 ]]; then
            python -m ues.rp_authority_runtime "$PROJECT" | tee lifecycle-result.json
          else
            python -m ues.lifecycle_runtime_observed "$PROJECT" | tee lifecycle-result.json
          fi
          python -m ues.initial_lineage_runtime "$PROJECT" | tee initial-lineage-result.json

      - name: Preserve compact runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ues-parent-result-${{ needs.preflight.outputs.request_id }}
          path: |
            parent-request-metadata.json
            lifecycle-result.json
            initial-lineage-result.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Render sanitized durable Parent Controller receipt
        if: always()
        env:
          UES_RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          UES_TRIGGER_KIND: ${{ needs.preflight.outputs.trigger_kind }}
          UES_TRIGGER_COMMENT_ID: ${{ needs.preflight.outputs.trigger_comment_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def load(path):
              try:
                  value = json.loads(Path(path).read_text(encoding='utf-8'))
                  return value if isinstance(value, dict) else None
              except (FileNotFoundError, json.JSONDecodeError):
                  return None

          metadata = load('parent-request-metadata.json') or {}
          lifecycle = load('lifecycle-result.json')
          initial = load('initial-lineage-result.json')

          def integer(value, key):
              item = value.get(key) if isinstance(value, dict) else None
              return item if isinstance(item, int) and not isinstance(item, bool) else None

          lifecycle_external = integer(lifecycle, 'external_effects_dispatched')
          initial_external = integer(initial, 'external_effects_dispatched')
          lifecycle_created = integer(lifecycle, 'new_tasks_or_sessions_created')
          initial_created = integer(initial, 'new_tasks_or_sessions_created')

          external = (
              lifecycle_external + initial_external
              if lifecycle_external is not None and initial_external is not None
              else None
          )
          created = (
              lifecycle_created + initial_created
              if lifecycle_created is not None and initial_created is not None
              else None
          )

          receipt = {
              'schema_version': 'UES_PARENT_CONTROLLER_RECEIPT_V1',
              'request_id': metadata.get('request_id'),
              'request_digest': metadata.get('request_digest'),
              'authority_event_id': metadata.get('authority_event_id'),
              'project': metadata.get('project'),
              'runtime_sha': metadata.get('runtime_sha'),
              'trigger_kind': os.environ.get('UES_TRIGGER_KIND') or None,
              'trigger_comment_id': os.environ.get('UES_TRIGGER_COMMENT_ID') or None,
              'execution_outcome': os.environ.get('UES_RUNTIME_OUTCOME') or 'unknown',
              'lifecycle_result': lifecycle.get('result') if isinstance(lifecycle, dict) else None,
              'initial_lineage_result': initial.get('result') if isinstance(initial, dict) else None,
              'external_effects_dispatched': external,
              'new_tasks_or_sessions_created': created,
              'effect_evidence_complete': external is not None and created is not None,
              'safe_to_blind_retry': False,
              'raw_session_ids_persisted': False,
              'secret_material_persisted': False,
          }
          body = (
              '<!-- UES_PARENT_CONTROLLER_RECEIPT_V1 -->\n'
              '### UES Parent Controller receipt\n\n'
              '```json\n' + json.dumps(receipt, sort_keys=True, indent=2) + '\n```\n'
          )
          Path('parent-controller-receipt.md').write_text(body, encoding='utf-8')
          PY

      - name: Publish durable Parent Controller receipt
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ needs.preflight.outputs.control_pr_number }}'),
              body: fs.readFileSync('parent-controller-receipt.md', 'utf8'),
            });
