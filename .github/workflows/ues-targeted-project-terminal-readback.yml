name: UES Targeted Project Terminal Readback

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      project:
        description: RP project to read back
        required: true
        type: choice
        options: [RP01, RP02, RP03, RP04]
      workstream:
        description: Optional exact durable logical workstream; blank means whole project
        required: false
        type: string

permissions:
  contents: read

jobs:
  authorize:
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.number == 191 && github.actor == 'hamad933') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      project: ${{ steps.command.outputs.project }}
      workstream: ${{ steps.command.outputs.workstream }}
    steps:
      - name: Authorize exact bounded readback command
        id: command
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          INPUT_PROJECT: ${{ inputs.project || '' }}
          INPUT_WORKSTREAM: ${{ inputs.workstream || '' }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re
          allowed = {"RP01", "RP02", "RP03", "RP04"}
          workstream_re = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$")
          if os.environ["EVENT_NAME"] == "issue_comment":
              match = re.fullmatch(
                  r"/ues-terminal-readback (RP01|RP02|RP03|RP04)(?: ([A-Za-z0-9][A-Za-z0-9._:-]{0,127}))?",
                  os.environ["COMMENT_BODY"].strip(),
              )
              if not match:
                  raise SystemExit("exact owner readback command required")
              project = match.group(1)
              workstream = match.group(2) or ""
          else:
              project = os.environ["INPUT_PROJECT"].strip().upper()
              workstream = os.environ["INPUT_WORKSTREAM"].strip()
              if project not in allowed:
                  raise SystemExit("unsupported project")
              if workstream and not workstream_re.fullmatch(workstream):
                  raise SystemExit("invalid exact workstream")
          print(f"project={project}")
          print(f"workstream={workstream}")
          PY

  readback:
    needs: authorize
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 70
    concurrency:
      # Whole-project targeted reads keep the canonical project serialization.
      # Exact-workstream reads use their own lane-specific group so a newer
      # scheduled/project-wide pending job cannot evict a Parent consumption
      # request before it starts. Exact terminal persistence is per-lineage CAS
      # with authoritative post-readback, so concurrent different-lineage reads
      # do not grant mutation authority or replay provider effects.
      group: ${{ needs.authorize.outputs.workstream != '' && format('ues-terminal-exact-readback-{0}-{1}', needs.authorize.outputs.project, needs.authorize.outputs.workstream) || format('ues-terminal-result-backfill-{0}', needs.authorize.outputs.project) }}
      cancel-in-progress: false
    steps:
      - name: Checkout governed default branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UES
        run: python -m pip install -e .

      - name: Run bounded terminal backfill GET-only
        id: backfill
        timeout-minutes: 45
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          UES_ALLOW_PUBLIC_SAME_REPO_STATE: "true"
          UES_STATE_REF_PREFIX: ues-runtime/v2
          UES_TERMINAL_BACKFILL_ACTIVITY_READ_WORKERS: "4"
          PROJECT: ${{ needs.authorize.outputs.project }}
          WORKSTREAM: ${{ needs.authorize.outputs.workstream }}
        run: |
          set +e
          if [[ -n "$WORKSTREAM" ]]; then
            python -m ues.exact_terminal_readback "$PROJECT" "$WORKSTREAM" > "$RUNNER_TEMP/ues-targeted-terminal-backfill-$PROJECT.json"
          else
            python -m ues.terminal_backfill "$PROJECT" > "$RUNNER_TEMP/ues-targeted-terminal-backfill-$PROJECT.json"
          fi
          status=$?
          set -e
          cat "$RUNNER_TEMP/ues-targeted-terminal-backfill-$PROJECT.json"
          exit "$status"

      - name: Preserve targeted terminal backfill receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ues-targeted-terminal-backfill-${{ needs.authorize.outputs.project }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ues-targeted-terminal-backfill-${{ needs.authorize.outputs.project }}.json
          retention-days: 7
          if-no-files-found: error

      - name: Read project lifecycle after targeted backfill
        if: always()
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UES_ALLOW_PUBLIC_SAME_REPO_STATE: "true"
          UES_STATE_REF_PREFIX: ues-runtime/v2
          PROJECT: ${{ needs.authorize.outputs.project }}
          WORKSTREAM: ${{ needs.authorize.outputs.workstream }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from ues.terminal_lifecycle import run

          project = os.environ["PROJECT"]
          workstream = os.environ.get("WORKSTREAM", "").strip()
          result = run(project)
          summary = result.get("summary", {}) if isinstance(result.get("summary"), dict) else {}
          safe_results = []
          for item in result.get("results", []):
              if not isinstance(item, dict):
                  continue
              if workstream and str(item.get("logical_workstream") or "") != workstream:
                  continue
              safe_results.append({key: item.get(key) for key in (
                  "project", "route", "logical_workstream", "role", "generation",
                  "session_fingerprint", "repository", "status", "verdict", "candidate_sha",
                  "reviewed_sha", "finding_count", "findings", "result_state", "freshness_status",
                  "result_fingerprint", "current_view_fingerprint", "parent_action_required",
                  "safe_read_only_recovery_exists",
              ) if key in item})
          receipt = {
              "schema_version": "UES_TARGETED_TERMINAL_LIFECYCLE_READBACK_V2",
              "project": project,
              "exact_workstream_filter": workstream or None,
              "result": result.get("result"),
              "results": safe_results,
              "summary": {key: summary.get(key) for key in (
                  "lineage_count", "provider_session_count", "provider_inventory_source",
                  "provider_observation_available", "provider_observation_fresh",
                  "provider_observation_reason", "terminal_result_count",
                  "durable_lineage_terminal_result_count", "parent_consumable_result_count",
                  "terminal_unconsumed_result_count", "blocked_lane_freezes_independent_lanes",
              ) if key in summary},
              "provider_mutation_performed": False,
              "new_tasks_or_sessions_created": 0,
              "safe_to_blind_retry": False,
              "raw_activity_content_persisted": False,
              "raw_session_ids_persisted": False,
              "raw_titles_persisted": False,
          }
          path = Path(os.environ["RUNNER_TEMP"]) / f"ues-targeted-terminal-lifecycle-{project}.json"
          path.write_text(json.dumps(receipt, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({
              "project": project,
              "exact_workstream_filter": workstream or None,
              "matched_result_count": len(safe_results),
              "blocked_lane_freezes_independent_lanes": False,
          }, sort_keys=True))
          PY

      - name: Preserve targeted lifecycle receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ues-targeted-terminal-lifecycle-${{ needs.authorize.outputs.project }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ues-targeted-terminal-lifecycle-${{ needs.authorize.outputs.project }}.json
          retention-days: 7
          if-no-files-found: error
