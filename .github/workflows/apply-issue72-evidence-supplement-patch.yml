name: Apply Issue72 Evidence Supplement Patch

on:
  push:
    branches:
      - fix/issue72-evidence-supplement-runtime
    paths:
      - tools/apply_issue72_evidence_supplement_patch.py
      - .github/workflows/apply-issue72-evidence-supplement-patch.yml

permissions:
  contents: write

concurrency:
  group: issue72-evidence-supplement-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact feature head
        uses: actions/checkout@v4
        with:
          ref: fix/issue72-evidence-supplement-runtime
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply minimal reviewed integration patch
        run: python tools/apply_issue72_evidence_supplement_patch.py

      - name: Verify integration and focused tests
        run: |
          python -m py_compile ues/evidence_supplement_runtime.py ues/initial_lineage_runtime.py
          python -m unittest tests.test_evidence_supplement_runtime -v
          git diff --check
          git diff --exit-code -- ues/evidence_supplement_runtime.py tests/test_evidence_supplement_runtime.py
          git diff -- ues/initial_lineage_runtime.py

      - name: Commit only canonical runtime integration
        run: |
          set -euo pipefail
          test -n "$(git status --short -- ues/initial_lineage_runtime.py)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ues/initial_lineage_runtime.py
          git commit -m "UES: integrate governed evidence supplements into initial lineage runtime (#72)"
          git push origin HEAD:fix/issue72-evidence-supplement-runtime
