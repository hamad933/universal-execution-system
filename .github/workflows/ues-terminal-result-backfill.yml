name: UES Terminal Result Backfill

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "11,26,41,56 * * * *"

permissions:
  contents: read

concurrency:
  group: ues-terminal-result-backfill
  cancel-in-progress: false

jobs:
  discover-projects:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      projects: ${{ steps.discover.outputs.projects }}
    steps:
      - name: Checkout governed default branch
        uses: actions/checkout@v4

      - name: Discover repository-backed governed adapters
        id: discover
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          projects = []
          for path in sorted(Path('adapters').glob('*.json')):
              if path.name == 'registry.json':
                  continue
              try:
                  value = json.loads(path.read_text(encoding='utf-8'))
              except (OSError, json.JSONDecodeError):
                  continue
              if not isinstance(value, dict):
                  continue
              project = str(value.get('project') or '').strip().upper()
              repository = str(value.get('repository') or '').strip()
              if project and repository.count('/') == 1 and project not in projects:
                  projects.append(project)
          if not projects:
              raise SystemExit('no repository-backed governed adapters discovered')
          print('projects=' + json.dumps(projects, separators=(',', ':')))
          PY

  backfill:
    needs: discover-projects
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        project: ${{ fromJSON(needs.discover-projects.outputs.projects) }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout governed default branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UES
        run: python -m pip install -e .

      - name: Read-only terminal backfill for exact governed project
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          UES_ALLOW_PUBLIC_SAME_REPO_STATE: "true"
          UES_STATE_REF_PREFIX: ues-runtime/v2
        run: |
          set +e
          python -m ues.terminal_backfill "${{ matrix.project }}" > "$RUNNER_TEMP/ues-terminal-backfill-${{ matrix.project }}.json"
          status=$?
          set -e
          cat "$RUNNER_TEMP/ues-terminal-backfill-${{ matrix.project }}.json"
          exit "$status"

      - name: Preserve project terminal backfill receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ues-terminal-backfill-${{ matrix.project }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ues-terminal-backfill-${{ matrix.project }}.json
          retention-days: 7
          if-no-files-found: error

  lifecycle-readback:
    if: always()
    needs: [discover-projects, backfill]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        project: ${{ fromJSON(needs.discover-projects.outputs.projects) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout governed default branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UES
        run: python -m pip install -e .

      - name: Read exact adapter-backed lifecycle independently
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UES_ALLOW_PUBLIC_SAME_REPO_STATE: "true"
          UES_STATE_REF_PREFIX: ues-runtime/v2
          UES_PROJECT: ${{ matrix.project }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from ues.terminal_lifecycle import run

          project = os.environ['UES_PROJECT']
          failure = None
          output = None
          try:
              result = run(project)
          except Exception as exc:
              failure = {
                  'error_category': str(getattr(exc, 'category', None) or type(exc).__name__).upper(),
                  'exception_text_persisted': False,
              }
          else:
              summary = result.get('summary', {}) if isinstance(result.get('summary'), dict) else {}
              safe_results = []
              for item in result.get('results', []):
                  if not isinstance(item, dict):
                      continue
                  safe_results.append({
                      key: item.get(key)
                      for key in (
                          'project', 'route', 'logical_workstream', 'role', 'generation',
                          'session_fingerprint', 'repository', 'status', 'verdict',
                          'candidate_sha', 'reviewed_sha', 'finding_count', 'result_state',
                          'freshness_status', 'result_fingerprint', 'current_view_fingerprint',
                          'parent_action_required', 'safe_read_only_recovery_exists',
                      )
                      if key in item
                  })
              output = {
                  'result': result.get('result'),
                  'results': safe_results,
                  'summary': {
                      key: summary.get(key)
                      for key in (
                          'lineage_count', 'provider_session_count', 'provider_inventory_source',
                          'provider_observation_available', 'provider_observation_fresh',
                          'provider_observation_reason', 'terminal_result_count',
                          'durable_lineage_terminal_result_count', 'parent_consumable_result_count',
                          'terminal_unconsumed_result_count', 'blocked_lane_freezes_independent_lanes',
                      )
                      if key in summary
                  },
              }
          receipt = {
              'schema_version': 'UES_TERMINAL_LIFECYCLE_READBACK_V1',
              'project': project,
              'output': output,
              'failure': failure,
              'blocked_lane_freezes_independent_lanes': False,
              'provider_mutation_performed': False,
              'new_tasks_or_sessions_created': 0,
              'safe_to_blind_retry': False,
              'findings_persisted_in_artifact': False,
              'raw_activity_content_persisted': False,
              'raw_session_ids_persisted': False,
              'raw_titles_persisted': False,
          }
          path = Path(os.environ['RUNNER_TEMP']) / f'ues-terminal-lifecycle-readback-{project}.json'
          path.write_text(json.dumps(receipt, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({
              'project': project,
              'failure': failure is not None,
              'parent_consumable_result_count': int(((output or {}).get('summary') or {}).get('parent_consumable_result_count') or 0),
              'blocked_lane_freezes_independent_lanes': False,
          }, sort_keys=True))
          if output is None:
              raise SystemExit(2)
          PY

      - name: Preserve project lifecycle readback receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ues-terminal-lifecycle-readback-${{ matrix.project }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ues-terminal-lifecycle-readback-${{ matrix.project }}.json
          retention-days: 7
          if-no-files-found: error

  terminal-watchdog:
    if: always()
    needs: [backfill, lifecycle-readback]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout governed default branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UES
        run: python -m pip install -e .

      - name: Audit terminal-result liveness without freezing independent lanes
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UES_ALLOW_PUBLIC_SAME_REPO_STATE: "true"
          UES_STATE_REF_PREFIX: ues-runtime/v2
        run: python -m ues.terminal_watchdog
