name: UES RP04 Reviewer Wave R11 Adjudicated Recovery 20260827

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ues-rp04-reviewer-wave-r11-adjudicated-recovery-20260827.yml

permissions:
  actions: read
  contents: write

jobs:
  adjudicate-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install UES
        run: python -m pip install -e .
      - name: Recover exact R10 governed authority artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 33088305216 -n rp04-reviewer-wave-r10-33088305216 -D r10
          test -s r10/rp04-r10-authority.json
      - name: Execute Parent-adjudicated same-lineage Reviewer replacement wave
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          UES_ALLOW_PUBLIC_SAME_REPO_STATE: "true"
          UES_STATE_REF_PREFIX: ues-runtime/v2
          UES_AUTHORITY_TRANSPORT_ACTOR: hamad933
          UES_RP_PROVIDER_INVENTORY_SNAPSHOT_ATTEMPTS: "3"
        shell: bash
        run: |
          set +e
          python - <<'PY' 2>&1 | tee rp04-r11-lifecycle.json
          import json, os, sys
          from ues import lifecycle_runtime_v2 as runtime_v2
          from ues import rp_authority_runtime

          authority=json.load(open('r10/rp04-r10-authority.json',encoding='utf-8'))
          selected={f'RP04-IPA-S{i:02d}-001' for i in range(1,11)} | {'RP04-IPA-S12-001','RP04-IPA-S13-001'}
          authority['lineages']={k:v for k,v in authority.get('lineages',{}).items() if k in selected}
          authorized=authority.get('generation_policy',{}).get('authorized_lineages',{})
          authority['generation_policy']['authorized_lineages']={k:v for k,v in authorized.items() if k.split(':',1)[0] in selected}
          os.environ['UES_CURRENT_AUTHORITY_JSON']=json.dumps(authority,separators=(',',':'),ensure_ascii=False)

          original=runtime_v2.find_latest_structured_handoff_runtime
          def parent_adjudicated_handoff(activities, *, expected_workstream, expected_role):
              value=original(activities, expected_workstream=expected_workstream, expected_role=expected_role)
              if expected_workstream in selected and str(expected_role).upper()=='REVIEWER' and value is not None:
                  return None
              return value
          runtime_v2.find_latest_structured_handoff_runtime=parent_adjudicated_handoff
          try:
              result=rp_authority_runtime.run('RP04')
          finally:
              runtime_v2.find_latest_structured_handoff_runtime=original
          print(json.dumps(result,sort_keys=True,ensure_ascii=False))
          json.dump(result,open('rp04-r11-result.json','w',encoding='utf-8'),sort_keys=True,ensure_ascii=False)
          if result.get('result')=='PROVIDER_READ_UNAVAILABLE_BEFORE_EFFECTS':
              sys.exit(75)
          PY
          code=${PIPESTATUS[0]}
          exit "$code"
      - name: Preserve authoritative R11 receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rp04-reviewer-wave-r11-${{ github.run_id }}
          path: |
            rp04-r11-lifecycle.json
            rp04-r11-result.json
            r10/rp04-r10-authority.json
          if-no-files-found: warn
          retention-days: 14
