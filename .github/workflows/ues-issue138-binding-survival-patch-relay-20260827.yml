name: UES Issue138 Binding Survival Patch Relay 20260827

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ues-issue138-binding-survival-patch-relay-20260827.yml

permissions:
  contents: write

jobs:
  build-fix-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply bounded generic binding-survival patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c fix/issue138-durable-binding-survival
          python - <<'PY'
          from pathlib import Path

          path = Path("ues/lineage_registry.py")
          text = path.read_text(encoding="utf-8")

          old1 = '''    status = str(binding.get("status") or "UNBOUND")\n    session = binding.get("session") if isinstance(binding.get("session"), Mapping) else None\n    current_fp = str(binding.get("session_fingerprint") or "") or None\n    generation = previous_generation\n    replacement_reason: str | None = None\n    revoked_legacy_fp: str | None = None\n'''
          new1 = '''    status = str(binding.get("status") or "UNBOUND")\n    session = binding.get("session") if isinstance(binding.get("session"), Mapping) else None\n    current_fp = str(binding.get("session_fingerprint") or "") or None\n    generation = previous_generation\n    replacement_reason: str | None = None\n    revoked_legacy_fp: str | None = None\n    governed_fingerprints = {\n        str(item).strip().lower()\n        for item in policy.get("known_session_fingerprints") or []\n        if str(item).strip()\n    }\n'''
          if old1 not in text:
              raise SystemExit("Issue138 patch precondition 1 not found; main moved incompatibly")
          text = text.replace(old1, new1, 1)

          old2 = '''    elif current_fp and current_fp != previous_fp:\n        generation = max(1, previous_generation + 1)\n        replacement_reason = "INITIAL_ADOPTION" if previous_fp is None else "PROVIDER_SESSION_GENERATION_CHANGED"\n    elif current_fp and generation == 0:\n        generation = 1\n'''
          new2 = '''    elif current_fp and current_fp != previous_fp:\n        if previous_fp is None and previous_generation > 0 and current_fp.lower() in governed_fingerprints:\n            # A temporarily unobservable provider session must not manufacture a\n            # new generation when its exact durable fingerprint is later rebound.\n            generation = previous_generation\n            replacement_reason = "DURABLE_FINGERPRINT_REBOUND"\n        else:\n            generation = max(1, previous_generation + 1)\n            replacement_reason = "INITIAL_ADOPTION" if previous_fp is None else "PROVIDER_SESSION_GENERATION_CHANGED"\n    elif current_fp and generation == 0:\n        generation = 1\n'''
          if old2 not in text:
              raise SystemExit("Issue138 patch precondition 2 not found; main moved incompatibly")
          text = text.replace(old2, new2, 1)

          old3 = '''    evidence = {\n        "schema_version": SCHEMA_VERSION,\n        "role": role,\n        "workstream": workstream,\n        "generation": generation,\n        "session_fingerprint": current_fp,\n'''
          new3 = '''    # Provider observability can be transiently incomplete; that is not authority\n    # to erase an already proven durable session identity. Legacy unsafe adoption\n    # is revoked above before this preservation rule is applied.\n    durable_fp = current_fp or previous_fp\n    evidence = {\n        "schema_version": SCHEMA_VERSION,\n        "role": role,\n        "workstream": workstream,\n        "generation": generation,\n        "session_fingerprint": durable_fp,\n'''
          if old3 not in text:
              raise SystemExit("Issue138 patch precondition 3 not found; main moved incompatibly")
          text = text.replace(old3, new3, 1)
          path.write_text(text, encoding="utf-8")

          test = r'''from __future__ import annotations

import tempfile
import unittest
from pathlib import Path

from ues.lineage_registry import lineage_lane_id, upsert_lineage_observation
from ues.state_store import DeterministicFileStateStore, WorkstreamRuntimeRecord

FP3 = "a" * 64
FP4 = "b" * 64


class DurableLineageBindingSurvivalTests(unittest.TestCase):
    def _store(self, evidence):
        root = tempfile.TemporaryDirectory()
        self.addCleanup(root.cleanup)
        store = DeterministicFileStateStore(Path(root.name) / "state.json")
        store.initialize()
        lane = lineage_lane_id("RP04", "RP04", "RP04-IPA-S01-001", "REVIEWER")
        record = WorkstreamRuntimeRecord(
            lane_id=lane,
            project="RP04",
            route="RP04",
            workstream_id="LINEAGE::RP04-IPA-S01-001::REVIEWER",
            evidence_bindings=dict(evidence),
        )
        store.compare_and_swap_workstream(lane, 0, record)
        return store, lane

    def test_unbound_observation_preserves_proven_durable_fingerprint(self):
        store, lane = self._store({
            "generation": 3,
            "session_fingerprint": FP3,
            "replacement_reason": "STRUCTURED_HANDOFF_RECOVERY_REQUIRED",
        })
        result = upsert_lineage_observation(
            store,
            project="RP04",
            route="RP04",
            workstream="RP04-IPA-S01-001",
            role="REVIEWER",
            binding={"status": "UNBOUND", "reason": "PROVIDER_READ_TEMPORARILY_INCOMPLETE"},
            policy={"known_session_fingerprints": [FP3], "provider_starting_branch": "main"},
        )
        read = store.read_workstream(lane)
        evidence = read.record.evidence_bindings
        self.assertEqual(result["binding_status"], "UNBOUND")
        self.assertEqual(evidence["generation"], 3)
        self.assertEqual(evidence["session_fingerprint"], FP3)
        self.assertEqual(evidence["binding_status"], "UNBOUND")

    def test_exact_governed_rebind_does_not_increment_generation(self):
        store, lane = self._store({
            "generation": 3,
            "session_fingerprint": None,
            "known_session_fingerprints": [FP3],
        })
        result = upsert_lineage_observation(
            store,
            project="RP04",
            route="RP04",
            workstream="RP04-IPA-S01-001",
            role="REVIEWER",
            binding={
                "status": "PROVEN",
                "reason": "EXACT_GOVERNED_LINEAGE_BINDING",
                "session_fingerprint": FP3,
                "provider_state": "COMPLETED",
                "session": {"_source_repository": "hamad933/Real-Estate-Assets-Control-", "sourceStartingBranch": "main"},
            },
            policy={"known_session_fingerprints": [FP3], "provider_starting_branch": "main"},
        )
        read = store.read_workstream(lane)
        evidence = read.record.evidence_bindings
        self.assertEqual(result["generation"], 3)
        self.assertEqual(evidence["generation"], 3)
        self.assertEqual(evidence["session_fingerprint"], FP3)
        self.assertEqual(evidence["replacement_reason"], "DURABLE_FINGERPRINT_REBOUND")

    def test_genuine_new_exact_fingerprint_still_advances_generation(self):
        store, lane = self._store({"generation": 3, "session_fingerprint": FP3})
        result = upsert_lineage_observation(
            store,
            project="RP04",
            route="RP04",
            workstream="RP04-IPA-S01-001",
            role="REVIEWER",
            binding={
                "status": "PROVEN",
                "reason": "EXACT_GOVERNED_LINEAGE_BINDING",
                "session_fingerprint": FP4,
                "provider_state": "COMPLETED",
                "session": {"_source_repository": "hamad933/Real-Estate-Assets-Control-", "sourceStartingBranch": "main"},
            },
            policy={"known_session_fingerprints": [FP3, FP4], "provider_starting_branch": "main"},
        )
        read = store.read_workstream(lane)
        self.assertEqual(result["generation"], 4)
        self.assertEqual(read.record.evidence_bindings["session_fingerprint"], FP4)
        self.assertEqual(read.record.evidence_bindings["replacement_reason"], "PROVIDER_SESSION_GENERATION_CHANGED")


if __name__ == "__main__":
    unittest.main()
'''
          Path("tests/test_durable_lineage_binding_survival.py").write_text(test, encoding="utf-8")
          PY
          python -m pytest -q tests/test_durable_lineage_binding_survival.py tests/test_exact_fingerprint_branch_drift.py
          git add ues/lineage_registry.py tests/test_durable_lineage_binding_survival.py
          git commit -m "UES: preserve durable lineage binding across unbound observations"
          git push origin HEAD:refs/heads/fix/issue138-durable-binding-survival
